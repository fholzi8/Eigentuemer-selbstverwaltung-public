<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }

        .content {
            white-space: pre-wrap;
            margin-bottom: 30px;
        }

        .footer {
            margin-top: 30px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>
    <div class="header">
        <h2>{{ title }}</h2>
    </div>

    <div class="content">
        {{ content }}
    </div>

    <div class="footer">
        <p>Diese E-Mail wurde automatisch über die WEG-App der {{ selbstverwaltung.name }} versendet.</p>
        <p>Bei Fragen wenden Sie sich bitte an {{ selbstverwaltung.verwalter }} ({{ selbstverwaltung.email }}).</p>
    </div>
</body>

</html>
