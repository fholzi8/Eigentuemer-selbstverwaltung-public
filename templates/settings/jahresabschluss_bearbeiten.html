{% extends "layout.html" %}

{% block title %}- Jahresabschluss bearbeiten{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Jahresabschluss bearbeiten</h1>
    <a href="{{ url_for('settings.jahresabschluss_liste') }}" class="btn btn-outline-secondary">Zurück zur Übersicht</a>
</div>

<div class="card">
    <div class="card-header bg-light">
        <h5 class="mb-0">Jahresabschluss {{ jahresabschluss.jahr }}</h5>
    </div>
    <div class="card-body">
        <form method="POST"
            action="{{ url_for('settings.jahresabschluss_bearbeiten', jahresabschluss_id=jahresabschluss.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label for="jahr" class="form-label">Jahr</label>
                <input type="text" class="form-control-plaintext" id="jahr" value="{{ jahresabschluss.jahr }}" readonly>
            </div>

            <div class="mb-3">
                <label for="kontostand" class="form-label">Kontostand am Jahresende</label>
                <div class="input-group">
                    <input type="number" class="form-control" id="kontostand" name="kontostand" step="0.01"
                        value="{{ jahresabschluss.kontostand }}" required>
                    <span class="input-group-text">€</span>
                </div>
                <div class="form-text">Kontostand am 31.12. des Jahres</div>
            </div>

            <div class="mb-3">
                <label for="vorjahres_saldo" class="form-label">Saldo aus dem Vorjahr</label>
                <div class="input-group">
                    <input type="number" class="form-control" id="vorjahres_saldo" name="vorjahres_saldo" step="0.01"
                        value="{{ jahresabschluss.vorjahres_saldo }}" required>
                    <span class="input-group-text">€</span>
                </div>
                <div class="form-text">Saldo aus dem vorhergehenden Jahr</div>
            </div>

            <div class="mb-3">
                <label for="kommentar" class="form-label">Kommentar</label>
                <textarea class="form-control" id="kommentar" name="kommentar"
                    rows="3">{{ jahresabschluss.kommentar }}</textarea>
            </div>

            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary">Speichern</button>
                <a href="{{ url_for('settings.jahresabschluss_liste') }}"
                    class="btn btn-outline-secondary">Abbrechen</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
