{% extends "layout.html" %}

{% block title %}- Neuer Jahresabschluss{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Neuer Jahresabschluss</h1>
    <a href="{{ url_for('settings.jahresabschluss_liste') }}" class="btn btn-outline-secondary">Zurück zur Übersicht</a>
</div>

<div class="card">
    <div class="card-header bg-light">
        <h5 class="mb-0">Jahresabschluss-Daten eingeben</h5>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('settings.jahresabschluss_neu') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label for="jahr" class="form-label">Jahr</label>
                <select class="form-select" id="jahr" name="jahr" required>
                    {% for j in jahre %}
                    <option value="{{ j }}">{{ j }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="kontostand" class="form-label">Kontostand am Jahresende</label>
                <div class="input-group">
                    <input type="number" class="form-control" id="kontostand" name="kontostand" step="0.01" value="0.00"
                        required>
                    <span class="input-group-text">€</span>
                </div>
                <div class="form-text">Kontostand am 31.12. des Jahres</div>
            </div>

            <div class="mb-3">
                <label for="vorjahres_saldo" class="form-label">Saldo aus dem Vorjahr</label>
                <div class="input-group">
                    <input type="number" class="form-control" id="vorjahres_saldo" name="vorjahres_saldo" step="0.01"
                        value="0.00" required>
                    <span class="input-group-text">€</span>
                </div>
                <div class="form-text">Saldo aus dem vorhergehenden Jahr</div>
            </div>

            <div class="mb-3">
                <label for="kommentar" class="form-label">Kommentar</label>
                <textarea class="form-control" id="kommentar" name="kommentar" rows="3"></textarea>
            </div>

            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary">Speichern</button>
                <a href="{{ url_for('settings.jahresabschluss_liste') }}"
                    class="btn btn-outline-secondary">Abbrechen</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
